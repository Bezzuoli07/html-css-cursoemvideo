<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes, ou simplesmente aumente e diminua o tamanho da janela do navegador.</p>
    <picture>
        <source media="(max-width: 750px )" srcset="imagens/fotos-p.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagens/fotos-m.png" type="image/png">
        <img src="imagens/fotos-g.png" alt="foto">
    </picture>

    <h1>Reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML5.</p>
    <audio src="midia/audio.mp3" controls autoplay></audio>
    <!-- Aceita os seguintes formatos: MP3, WAV e OGG -->

    <audio> preload="metadata" controls autoplay loop>
    <source src="midia/audio.mp3" type="audio/mpeg">
    <source> src="midia/audio.ogg" type="audio/ogg">
    <source> src="midia/audio.wav" type="audio/wav">
    <p>Seu navegador não suporta a reprodução de áudio. <a href="midia/audio.mp3">Baixe o áudio</a></p>

    </audio>
</body>
</html>
